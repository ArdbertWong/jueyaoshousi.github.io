<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绝妖寿司挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        
        .game-container {
            text-align: center;
            padding: 10px;
        }
        
        h1 {
            font-size: 1.6em;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        
        .subtitle {
            color: #aaa;
            margin-bottom: 8px;
            font-size: 0.8em;
        }
        
        /* 难度选择 */
        .difficulty-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        
        .difficulty-btn {
            padding: 6px 14px;
            font-size: 0.85em;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            color: #aaa;
        }
        
        .difficulty-btn:hover {
            border-color: #666;
            color: #fff;
        }
        
        .difficulty-btn.active {
            border-color: #ffd700;
            background: linear-gradient(145deg, #3a3a5a, #2a2a4a);
            color: #ffd700;
            font-weight: bold;
        }
        
        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 8px;
            font-size: 1em;
        }
        
        .status-item {
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            padding: 5px 15px;
            border-radius: 15px;
            border: 1px solid #444;
        }
        
        .status-item .label {
            color: #888;
            font-size: 0.8em;
        }
        
        .status-item .value {
            color: #ffd700;
            font-weight: bold;
            margin-left: 8px;
        }
        
        .timer.warning {
            color: #ff6b6b;
            animation: timerBlink 0.5s infinite;
        }
        
        @keyframes timerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* 题目显示区 */
        .question-area {
            margin-bottom: 5px;
            min-height: 55px;
        }
        
        .question-label {
            font-size: 0.9em;
            color: #ffd700;
            margin-bottom: 5px;
        }
        
        .arrows-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: center;
        }
        
        .arrow-box {
            position: relative;
            width: 50px;
            height: 50px;
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            border: 2px solid #ffd700;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8em;
            box-shadow: 0 0 10px rgba(255,215,0,0.3);
        }
        
        .arrow-box .subscript {
            position: absolute;
            bottom: 1px;
            right: 3px;
            font-size: 0.45em;
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .arrow-box .subscript.five {
            color: #4ecdc4;
        }
        
        /* 游戏场地 */
        .grid-container {
            display: inline-block;
            background: #0a0a1a;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            margin-top: 3px;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 55px);
            grid-template-rows: repeat(5, 55px);
            gap: 3px;
        }
        
        .cell {
            width: 55px;
            height: 55px;
            background: linear-gradient(145deg, #2a2a4a, #1a1a3a);
            border: 1px solid #444;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6em;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
            color: transparent;
        }
        
        .cell:hover:not(.disabled):not(.gameover) {
            background: linear-gradient(145deg, #3a3a5a, #2a2a4a);
            border-color: #666;
            transform: scale(1.05);
        }
        
        .cell.disabled {
            background: #111;
            border-color: #222;
            cursor: default;
            color: #333;
        }
        
        .cell.disabled::after {
            content: '✕';
            color: #333;
            font-size: 1.2em;
        }
        
        .cell.revealed {
            color: #fff;
        }
        
        .cell.selected {
            background: linear-gradient(145deg, #4a4a6a, #3a3a5a) !important;
            border-color: #ffd700 !important;
            box-shadow: 0 0 15px rgba(255,215,0,0.4);
        }
        
        .cell.correct {
            background: linear-gradient(145deg, #2d5a3d, #1a4a2a) !important;
            border-color: #4ecdc4 !important;
            animation: correctPulse 0.5s ease;
        }
        
        .cell.wrong {
            background: linear-gradient(145deg, #5a2d3d, #4a1a2a) !important;
            border-color: #ff6b6b !important;
            animation: wrongShake 0.5s ease;
        }
        
        .cell.answer-reveal {
            background: linear-gradient(145deg, #3a3a6a, #2a2a5a) !important;
            border-color: #ffd700 !important;
            color: #ffd700 !important;
        }
        
        .cell.gameover {
            cursor: default;
            opacity: 0.6;
        }
        
        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        /* 反馈信息 */
        .feedback {
            min-height: 24px;
            margin: 3px 0;
            font-size: 1em;
            font-weight: bold;
        }
        
        .feedback.correct-text {
            color: #4ecdc4;
        }
        
        .feedback.wrong-text {
            color: #ff6b6b;
        }
        
        .feedback.timeout-text {
            color: #ff6b6b;
        }
        
        /* 连击显示 */
        .combo-display {
            font-size: 1em;
            color: #ff6b6b;
            min-height: 24px;
            margin: 2px 0;
        }
        
        .combo-display.active {
            animation: comboPop 0.3s ease;
        }
        
        @keyframes comboPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        
        /* 结束覆盖层 */
        .gameover-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        
        .gameover-overlay.active {
            display: flex;
        }
        
        .gameover-panel {
            background: linear-gradient(145deg, #1a1a3a, #0a0a2a);
            padding: 30px 40px;
            border-radius: 20px;
            border: 2px solid #444;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }
        
        .gameover-panel h2 {
            font-size: 2em;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .gameover-panel .stats-row {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 20px 0;
        }
        
        .gameover-panel .stat-item {
            text-align: center;
        }
        
        .gameover-panel .stat-item .num {
            font-size: 2.5em;
            color: #ffd700;
            font-weight: bold;
        }
        
        .gameover-panel .stat-item .text {
            color: #888;
            font-size: 0.9em;
        }
        
        .gameover-panel .reason {
            color: #aaa;
            margin-bottom: 15px;
            font-size: 1em;
        }
        
        /* 按钮 */
        .btn {
            padding: 12px 35px;
            font-size: 1.1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            margin: 5px;
        }
        
        .btn-primary {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            color: #1a1a2e;
            font-weight: bold;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,215,0,0.4);
        }
        
        /* 提示文字 */
        .select-hint {
            color: #888;
            font-size: 1.1em;
            margin: 20px 0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🍣 绝妖寿司挑战</h1>
        <p class="subtitle">点击方格探索箭头 · 按顺序答题</p>
        
        <!-- 难度选择 -->
        <div class="difficulty-bar">
            <button class="difficulty-btn" data-diff="3" onclick="selectDifficulty(3)">3秒</button>
            <button class="difficulty-btn" data-diff="5" onclick="selectDifficulty(5)">5秒</button>
            <button class="difficulty-btn" data-diff="10" onclick="selectDifficulty(10)">10秒</button>
            <button class="difficulty-btn" data-diff="0" onclick="selectDifficulty(0)">不计时</button>
        </div>
        
        <!-- 状态栏 -->
        <div class="status-bar">
            <div class="status-item">
                <span class="label">连击</span>
                <span class="value" id="combo">0</span>
            </div>
            <div class="status-item" id="timerItem" style="display:none;">
                <span class="label">本题</span>
                <span class="value timer" id="timer">-</span>
            </div>
        </div>
        
        <!-- 题目区 -->
        <div class="question-area">
            <div class="question-label" id="questionLabel">请选择难度开始游戏</div>
            <div class="arrows-display" id="arrowsDisplay"></div>
        </div>
        
        <div class="combo-display" id="comboDisplay"></div>
        <div class="feedback" id="feedback"></div>
        
        <!-- 棋盘 -->
        <div class="grid-container">
            <div class="grid" id="gameGrid"></div>
        </div>
    </div>
    
    <!-- 结束覆盖层 -->
    <div class="gameover-overlay" id="gameoverOverlay">
        <div class="gameover-panel">
            <h2 id="gameoverTitle">💀 挑战失败</h2>
            <p class="reason" id="gameoverReason"></p>
            <div class="stats-row">
                <div class="stat-item">
                    <div class="num" id="goCorrect">0</div>
                    <div class="text">答对题数</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="goTotal">0</div>
                    <div class="text">总题数</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="goMaxCombo">0</div>
                    <div class="text">最高连击</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="restartGame()">🔄 重新开始</button>
        </div>
    </div>

    <script>
        // ==================== 游戏数据 ====================
        const ARROW_LAYOUT = {
            '1,1': '↓', '1,2': '←', '1,3': '←', '1,4': '←', '1,5': '←',
            '2,1': '↓',                          '2,5': '↑',
            '3,1': '↓',                          '3,5': '↑',
            '4,1': '↓',                          '4,5': '↑',
            '5,1': '→', '5,2': '→', '5,3': '→', '5,4': '→', '5,5': '↑'
        };
        
        const COMBINATIONS = [
            { name: '↓↓', arrows: ['↓','↓'], cells: [[2,1],[3,1]] },
            { name: '↑↑', arrows: ['↑','↑'], cells: [[3,5],[4,5]] },
            { name: '←←', arrows: ['←','←'], cells: [[1,3],[1,4]] },
            { name: '→→', arrows: ['→','→'], cells: [[5,3],[5,2]] },
            { name: '↓←', arrows: ['↓','←'], cells: [[1,1],[1,2]] },
            { name: '↑→', arrows: ['↑','→'], cells: [[5,5],[5,4]] },
            { name: '→↓', arrows: ['→','↓'], cells: [[5,1],[4,1]] },
            { name: '←↑', arrows: ['←','↑'], cells: [[1,5],[2,5]] }
        ];
        
        // ==================== 游戏状态 ====================
        let gameState = {
            difficulty: -1,     // -1=未选择, 0=不计时, 3/5/10=每题秒数
            timeLeft: 0,
            combo: 0,
            maxCombo: 0,
            correctCount: 0,
            totalCount: 0,
            currentQuestion: null,
            selectedCells: [],
            isProcessing: false,
            revealedCells: new Set(),
            timerInterval: null,
            isGameOver: false
        };
        
        // ==================== 难度选择 ====================
        
        function selectDifficulty(seconds) {
            // 更新按钮状态
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.dataset.diff) === seconds) {
                    btn.classList.add('active');
                }
            });
            
            // 如果正在游戏中，先结束当前游戏
            if (gameState.difficulty !== -1 && !gameState.isGameOver) {
                stopTimer();
            }
            
            gameState.difficulty = seconds;
            gameState.isGameOver = false;
            startGame();
        }
        
        // ==================== 初始化 ====================
        
        function initGrid() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            gameState.revealedCells = new Set();
            
            for (let r = 1; r <= 5; r++) {
                for (let c = 1; c <= 5; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    const key = `${r},${c}`;
                    const arrow = ARROW_LAYOUT[key];
                    
                    if (!arrow) {
                        cell.classList.add('disabled');
                    } else {
                        cell.dataset.arrow = arrow;
                        cell.textContent = arrow;
                        cell.addEventListener('click', () => onCellClick(r, c));
                    }
                    
                    grid.appendChild(cell);
                }
            }
        }
        
        // ==================== 游戏阶段 ====================
        
        function startGame() {
            gameState.timeLeft = gameState.difficulty;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.correctCount = 0;
            gameState.totalCount = 0;
            gameState.selectedCells = [];
            gameState.isProcessing = false;
            gameState.isGameOver = false;
            
            // 隐藏结束覆盖层
            document.getElementById('gameoverOverlay').classList.remove('active');
            
            // 清除所有格子的gameover状态
            document.querySelectorAll('#gameGrid .cell').forEach(cell => {
                cell.classList.remove('gameover');
            });
            
            updateStatus();
            initGrid();
            nextQuestion();
        }
        
        function updateStatus() {
            document.getElementById('combo').textContent = gameState.combo;
            
            const timerItem = document.getElementById('timerItem');
            if (gameState.difficulty > 0) {
                timerItem.style.display = 'block';
                document.getElementById('timer').textContent = gameState.timeLeft;
            } else {
                timerItem.style.display = 'none';
            }
        }
        
        // ==================== 计时器 ====================
        
        function startQuestionTimer() {
            stopTimer();
            
            if (gameState.difficulty <= 0) return;
            
            gameState.timeLeft = gameState.difficulty;
            updateStatus();
            document.getElementById('timer').classList.remove('warning');
            
            gameState.timerInterval = setInterval(() => {
                gameState.timeLeft--;
                updateStatus();
                
                if (gameState.timeLeft <= 2) {
                    document.getElementById('timer').classList.add('warning');
                }
                
                if (gameState.timeLeft <= 0) {
                    stopTimer();
                    handleTimeout();
                }
            }, 1000);
        }
        
        function stopTimer() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }
        
        // ==================== 题目生成 ====================
        
        let lastComboIndex = -1;
        
        function nextQuestion() {
            if (gameState.isGameOver) return;
            
            gameState.selectedCells = [];
            gameState.isProcessing = false;
            
            let comboIndex;
            do {
                comboIndex = Math.floor(Math.random() * COMBINATIONS.length);
            } while (comboIndex === lastComboIndex && COMBINATIONS.length > 1);
            
            lastComboIndex = comboIndex;
            const combo = COMBINATIONS[comboIndex];
            
            const swapLabels = Math.random() < 0.5;
            
            let display;
            let correctOrder;
            
            if (swapLabels) {
                display = [
                    { arrow: combo.arrows[0], label: '8' },
                    { arrow: combo.arrows[1], label: '5' }
                ];
                correctOrder = [combo.cells[1], combo.cells[0]];
            } else {
                display = [
                    { arrow: combo.arrows[0], label: '5' },
                    { arrow: combo.arrows[1], label: '8' }
                ];
                correctOrder = [combo.cells[0], combo.cells[1]];
            }
            
            gameState.currentQuestion = {
                combo,
                display,
                correctOrder,
                swapLabels
            };
            
            renderQuestion();
            clearFeedback();
            resetAllCells();
            startQuestionTimer();
        }
        
        function renderQuestion() {
            const container = document.getElementById('arrowsDisplay');
            container.innerHTML = '';
            
            const q = gameState.currentQuestion;
            
            q.display.forEach((item) => {
                const box = document.createElement('div');
                box.className = 'arrow-box';
                box.innerHTML = `
                    ${item.arrow}
                    <span class="subscript ${item.label === '5' ? 'five' : ''}">${item.label}</span>
                `;
                container.appendChild(box);
            });
            
            const isSameDirection = q.combo.arrows[0] === q.combo.arrows[1];
            
            document.getElementById('questionLabel').textContent = 
                isSameDirection 
                    ? `请找到两个「${q.combo.arrows[0]}」的位置（顺序不限）` 
                    : `请先选角标5对应的格子，再选角标8对应的格子`;
        }
        
        // ==================== 点击处理 ====================
        
        function onCellClick(row, col) {
            if (gameState.isProcessing || gameState.isGameOver) return;
            if (gameState.difficulty === -1) return;
            
            const cellKey = `${row},${col}`;
            const cellEl = document.querySelector(`#gameGrid .cell[data-row="${row}"][data-col="${col}"]`);
            
            if (!gameState.revealedCells.has(cellKey)) {
                gameState.revealedCells.add(cellKey);
                cellEl.classList.add('revealed');
                setTimeout(() => {
                    if (gameState.selectedCells.length < 2 && !gameState.isGameOver) {
                        processSelection(row, col);
                    }
                }, 300);
                return;
            }
            
            processSelection(row, col);
        }
        
        function processSelection(row, col) {
            const alreadySelected = gameState.selectedCells.find(c => c[0] === row && c[1] === col);
            if (alreadySelected) return;
            
            gameState.selectedCells.push([row, col]);
            
            const cellEl = document.querySelector(`#gameGrid .cell[data-row="${row}"][data-col="${col}"]`);
            cellEl.classList.add('selected');
            
            if (gameState.selectedCells.length === 2) {
                gameState.isProcessing = true;
                checkAnswer();
            }
        }
        
        function checkAnswer() {
            const q = gameState.currentQuestion;
            const [first, second] = gameState.selectedCells;
            const [correct1, correct2] = q.correctOrder;
            
            let isCorrect;
            
            const isSameDirection = q.combo.arrows[0] === q.combo.arrows[1];
            
            if (isSameDirection) {
                const matchA = first[0] === correct1[0] && first[1] === correct1[1];
                const matchB = second[0] === correct2[0] && second[1] === correct2[1];
                const matchC = first[0] === correct2[0] && first[1] === correct2[1];
                const matchD = second[0] === correct1[0] && second[1] === correct1[1];
                isCorrect = (matchA && matchB) || (matchC && matchD);
            } else {
                const match1 = first[0] === correct1[0] && first[1] === correct1[1];
                const match2 = second[0] === correct2[0] && second[1] === correct2[1];
                isCorrect = match1 && match2;
            }
            
            gameState.totalCount++;
            
            if (isCorrect) {
                handleCorrect();
            } else {
                handleWrong();
            }
        }
        
        // ==================== 答对处理 ====================
        
        function handleCorrect() {
            stopTimer();
            
            gameState.correctCount++;
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) {
                gameState.maxCombo = gameState.combo;
            }
            
            updateStatus();
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '✅ 正确！';
            feedback.className = 'feedback correct-text';
            
            const comboDisplay = document.getElementById('comboDisplay');
            if (gameState.combo >= 2) {
                comboDisplay.textContent = `🔥 ${gameState.combo}连击！`;
                comboDisplay.classList.add('active');
                setTimeout(() => comboDisplay.classList.remove('active'), 300);
            } else {
                comboDisplay.textContent = '';
            }
            
            gameState.selectedCells.forEach(([r, c]) => {
                const el = document.querySelector(`#gameGrid .cell[data-row="${r}"][data-col="${c}"]`);
                el.classList.remove('selected');
                el.classList.add('correct');
            });
            
            // 答对后直接进入下一题（不显示结束界面）
            setTimeout(() => {
                nextQuestion();
            }, 800);
        }
        
        // ==================== 答错处理 ====================
        
        function handleWrong() {
            stopTimer();
            gameState.isGameOver = true;
            gameState.combo = 0;
            updateStatus();
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '❌ 错误！';
            feedback.className = 'feedback wrong-text';
            document.getElementById('comboDisplay').textContent = '';
            
            gameState.selectedCells.forEach(([r, c]) => {
                const el = document.querySelector(`#gameGrid .cell[data-row="${r}"][data-col="${c}"]`);
                el.classList.remove('selected');
                el.classList.add('wrong');
            });
            
            // 显示正确答案
            const q = gameState.currentQuestion;
            q.correctOrder.forEach(([r, c], idx) => {
                setTimeout(() => {
                    const el = document.querySelector(`#gameGrid .cell[data-row="${r}"][data-col="${c}"]`);
                    el.classList.remove('wrong');
                    el.classList.add('answer-reveal');
                    gameState.revealedCells.add(`${r},${c}`);
                    el.classList.add('revealed');
                }, idx * 200);
            });
            
            // 延迟后显示结束界面
            setTimeout(() => {
                showGameOver('答错了！');
            }, 1500);
        }
        
        // ==================== 超时处理 ====================
        
        function handleTimeout() {
            gameState.isGameOver = true;
            gameState.combo = 0;
            updateStatus();
            
            const feedback = document.getElementById('feedback');
            feedback.textContent = '⏰ 时间到！';
            feedback.className = 'feedback timeout-text';
            document.getElementById('comboDisplay').textContent = '';
            
            // 禁用所有可点击格子
            document.querySelectorAll('#gameGrid .cell:not(.disabled)').forEach(cell => {
                cell.classList.add('gameover');
            });
            
            // 显示正确答案
            const q = gameState.currentQuestion;
            q.correctOrder.forEach(([r, c], idx) => {
                setTimeout(() => {
                    const el = document.querySelector(`#gameGrid .cell[data-row="${r}"][data-col="${c}"]`);
                    el.classList.add('answer-reveal');
                    gameState.revealedCells.add(`${r},${c}`);
                    el.classList.add('revealed');
                }, idx * 200);
            });
            
            setTimeout(() => {
                showGameOver('时间到了！');
            }, 1500);
        }
        
        // ==================== 结束界面 ====================
        
        function showGameOver(reason) {
            document.getElementById('gameoverTitle').textContent = '💀 挑战失败';
            document.getElementById('gameoverReason').textContent = reason;
            document.getElementById('goCorrect').textContent = gameState.correctCount;
            document.getElementById('goTotal').textContent = gameState.totalCount;
            document.getElementById('goMaxCombo').textContent = gameState.maxCombo;
            document.getElementById('gameoverOverlay').classList.add('active');
        }
        
        // ==================== 重新开始 ====================
        
        function restartGame() {
            document.getElementById('gameoverOverlay').classList.remove('active');
            startGame();
        }
        
        // ==================== 工具函数 ====================
        
        function resetAllCells() {
            gameState.revealedCells = new Set();
            document.querySelectorAll('#gameGrid .cell').forEach(cell => {
                cell.classList.remove('selected', 'correct', 'wrong', 'answer-reveal', 'revealed', 'gameover');
            });
        }
        
        function clearFeedback() {
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            document.getElementById('comboDisplay').textContent = '';
        }
        
        // ==================== 初始化 ====================
        
        function init() {
            initGrid();
            document.getElementById('questionLabel').textContent = '请选择难度开始游戏';
            document.getElementById('arrowsDisplay').innerHTML = '';
        }
        
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
